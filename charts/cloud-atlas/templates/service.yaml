apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-atlas.name" . }}
  labels:
    {{- include "cloud-atlas.labels" . | nindent 4 }}
  {{- if eq .Values.cloud "aws" }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "cloud-atlas.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
